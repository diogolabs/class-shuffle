<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mapeador de Turmas - Diogolabs</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ffb4ab",
                        "background": "#14130e",
                        "surface-container-low": "#1d1c15",
                        "surface-dim": "#14130e",
                        "on-secondary-container": "#00686f",
                        "surface-container-highest": "#36352e",
                        "surface-bright": "#3b3932",
                        "on-secondary": "#00363a",
                        "surface": "#14130e",
                        "on-background": "#e7e2d8",
                        "outline": "#969178",
                        "on-surface-variant": "#ccc7ac",
                        "surface-variant": "#36352e",
                        "primary": "#fffaff",
                        "surface-container-high": "#2b2a23",
                        "primary-container": "#f4e225",
                        "secondary": "#d3fbff",
                        "surface-container-lowest": "#0f0e09"
                    },
                    "fontFamily": {
                        "body-md": ["Space Grotesk"],
                        "headline-xl": ["Space Grotesk"],
                        "label-mono": ["Courier Prime"],
                        "headline-lg-mobile": ["Space Grotesk"]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #14130e; color: #e7e2d8; }
        .glass-panel {
            background: rgba(24, 23, 17, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(74, 71, 51, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .btn-primary { background-color: #f4e225; color: #1f1c00; transition: all 0.3s ease; }
        .btn-primary:hover { box-shadow: 0 0 15px rgba(244, 226, 37, 0.4); transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid #00eefc; color: #00eefc; transition: all 0.3s ease; }
        .btn-secondary:hover { box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); background: rgba(0, 238, 252, 0.1); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0e09; }
        ::-webkit-scrollbar-thumb { background: #36352e; border-radius: 4px; }
        .modal-enter { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="font-body-md min-h-screen flex flex-col md:flex-row overflow-x-hidden">

<nav class="hidden md:flex flex-col h-[calc(100vh)] py-8 bg-surface-container-lowest w-64 fixed left-0 top-0 border-r border-outline-variant z-40">
    <div class="px-6 mb-8 mt-4">
        <a href="https://diogolabs.dev.br" class="font-headline-lg-mobile font-bold text-primary tracking-tighter hover:text-primary-container transition-colors inline-block">Diogolabs</a>
        <div class="flex items-center gap-3 mt-4">
            <div class="w-10 h-10 rounded-lg bg-surface-variant p-1 flex items-center justify-center text-secondary-container">
                <span class="material-symbols-outlined">memory</span>
            </div>
            <div>
                <div class="text-secondary-container font-label-mono font-bold text-sm">Core Engine</div>
                <div class="text-on-surface-variant text-xs font-label-mono">v4.5 Stable</div>
            </div>
        </div>
    </div>
    <div class="flex-1 px-4 space-y-2">
        <a class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary-container text-on-primary-container font-bold shadow-[0_0_10px_rgba(244,226,37,0.4)] font-label-mono text-sm" href="https://diogolabs.dev.br">
            <span class="material-symbols-outlined">grid_view</span> Dashboard
        </a>
    </div>
</nav>

<main class="flex-1 w-full md:ml-64 pt-8 px-4 md:px-12 pb-24 min-h-screen bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-surface-container-high via-background to-surface-container-lowest">
    <div class="max-w-5xl mx-auto">
        <header class="mb-10">
            <h1 class="font-headline-xl text-primary mb-2 text-center md:text-left">Mapeador de Turmas</h1>
        </header>

        <div id="errorMessage" class="mb-6 bg-error/20 text-error border-l-4 border-error p-4 rounded font-label-mono hidden"></div>

        <!-- FORM SECTION -->
        <div id="formSection" class="glass-panel rounded-xl p-6 mb-10 flex flex-col gap-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Coluna 1: Geometria (Sempre visível) -->
                <div class="flex flex-col gap-5">
                    <h2 class="font-headline-lg-mobile text-secondary-container border-b border-outline-variant pb-2 flex items-center gap-2">
                        <span class="material-symbols-outlined">tune</span> Parâmetros Físicos
                    </h2>
                    
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Disciplina / Prova</label>
                        <input type="text" id="disciplina" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3 font-body-md focus:border-secondary-container focus:outline-none" placeholder="Ex: Maker">
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Geometria das Salas</label>
                        <div class="grid grid-cols-3 gap-3">
                            <div class="flex flex-col"><label class="text-xs text-outline mb-1">Salas</label><input type="number" id="numSalas" value="1" min="1" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-2"></div>
                            <div class="flex flex-col"><label class="text-xs text-outline mb-1">Fileiras(X)</label><input type="number" id="numFileiras" value="5" min="1" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-2"></div>
                            <div class="flex flex-col"><label class="text-xs text-outline mb-1">Carteiras(Y)</label><input type="number" id="numCarteiras" value="6" min="1" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-2"></div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Agrupamento</label>
                        <select id="regraTurma" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3 mb-2">
                            <option value="nenhuma">Ignorar turmas (Caos Total)</option>
                            <option value="separar">Misturar turmas (Isolamento)</option>
                            <option value="agrupar">Agrupar por turma (Blocos)</option>
                        </select>
                        <select id="agrupamento" onchange="document.getElementById('tamanhoGrupoGroup').style.display = this.value === 'grupo' ? 'flex' : 'none';" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3">
                            <option value="solo">Solo (Isolado)</option>
                            <option value="dupla">Dupla (2 por carteira)</option>
                            <option value="grupo">Grupo</option>
                        </select>
                    </div>

                    <div class="flex-col gap-2" id="tamanhoGrupoGroup" style="display: none;">
                        <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Tamanho do Grupo</label>
                        <input type="number" id="tamanhoGrupo" value="4" min="2" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3">
                    </div>
                </div>

                <!-- Coluna 2: Lógica de Duas Etapas -->
                <div class="flex flex-col gap-5 border-l border-outline-variant pl-0 md:pl-6">
                    <h2 class="font-headline-lg-mobile text-primary-container border-b border-outline-variant pb-2 flex items-center gap-2">
                        <span class="material-symbols-outlined">group</span> Gestão de Alunos
                    </h2>

                    <!-- ETAPA 1: Carregamento por Lotes -->
                    <div id="step1_carregar" class="flex flex-col gap-4">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Nome da Turma</label>
                            <input type="text" id="nomeTurmaTemp" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3 font-body-md focus:border-secondary-container focus:outline-none" placeholder="Ex: 901">
                        </div>
                        
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-label-mono text-on-surface-variant uppercase tracking-wider">Alunos (Um por linha)</label>
                            <textarea id="alunosTemp" class="bg-surface-container-highest border border-outline-variant text-primary rounded-md p-3 font-label-mono h-28 w-full focus:outline-none focus:border-primary-container" placeholder="Alice Saraiva..."></textarea>
                        </div>
                        
                        <button type="button" onclick="adicionarTurmaAoLote()" class="bg-surface-bright border border-outline-variant text-primary py-2 rounded font-label-mono hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-[18px]">add_circle</span> ADICIONAR TURMA
                        </button>

                        <div id="listaTurmasAdicionadas" class="flex flex-wrap gap-2 mt-2 empty:hidden"></div>

                        <button type="button" id="btnConfirmarLote" onclick="travarTurma()" class="hidden bg-surface-variant border border-primary-container text-primary-container py-3 rounded font-bold font-label-mono hover:bg-primary-container hover:text-background transition-colors items-center justify-center gap-2 mt-2">
                            <span class="material-symbols-outlined text-[18px]">lock</span> CONFIRMAR LISTA
                        </button>
                    </div>

                    <!-- ETAPA 2: Regras e Tags -->
                    <div id="step2_regras" class="hidden flex-col gap-4">
                        <div class="flex items-center justify-between bg-surface-container-highest p-3 rounded border border-outline-variant">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-green-400">check_circle</span>
                                <div>
                                    <div class="text-sm font-bold text-primary" id="lblTurmaTravada">Turmas Travadas</div>
                                    <div class="text-xs font-label-mono text-on-surface-variant" id="lblTurmaSub">0 Alunos</div>
                                </div>
                            </div>
                            <button type="button" onclick="destravarTurma()" class="text-error hover:underline text-xs font-label-mono">EDITAR</button>
                        </div>

                        <!-- Botões de Regra -->
                        <div class="grid grid-cols-2 gap-3 mt-2">
                            <div class="flex flex-col gap-2">
                                <button type="button" onclick="abrirModal('especiais')" class="bg-surface-container border border-outline-variant text-primary text-xs font-label-mono py-2 rounded hover:border-secondary-container transition-colors flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">visibility</span> FRENTE
                                </button>
                                <div id="chips_especiais" class="flex flex-wrap gap-1 min-h-[24px]"></div>
                            </div>
                            
                            <div class="flex flex-col gap-2">
                                <button type="button" onclick="abrirModal('pcd')" class="bg-surface-container border border-outline-variant text-primary text-xs font-label-mono py-2 rounded hover:border-blue-400 transition-colors flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">accessible</span> PCD
                                </button>
                                <div id="chips_pcd" class="flex flex-wrap gap-1 min-h-[24px]"></div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <button type="button" onclick="abrirModal('incompativeis')" class="bg-surface-container border border-outline-variant text-primary text-xs font-label-mono py-2 rounded hover:border-error transition-colors flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">front_hand</span> SEPARAR
                                </button>
                                <div id="chips_incompativeis" class="flex flex-wrap gap-1 min-h-[24px]"></div>
                            </div>

                            <div class="flex flex-col gap-2">
                                <button type="button" onclick="abrirModal('inseparaveis')" class="bg-surface-container border border-outline-variant text-primary text-xs font-label-mono py-2 rounded hover:border-primary-container transition-colors flex items-center justify-center gap-1">
                                    <span class="material-symbols-outlined text-[16px]">link</span> JUNTAR
                                </button>
                                <div id="chips_inseparaveis" class="flex flex-wrap gap-1 min-h-[24px]"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-6 flex gap-3 border-t border-outline-variant pt-6">
                <button type="button" id="btnGerar" onclick="embaralhar()" class="btn-primary flex-1 py-3 rounded-lg font-bold font-label-mono flex items-center justify-center gap-2 uppercase opacity-50 cursor-not-allowed" disabled>
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dataset</span> GERAR MAPEAMENTO
                </button>
            </div>
        </div>

        <!-- RESULTS SECTION -->
        <div id="resultSection" class="hidden flex-col gap-6">
            <div id="successMessage" class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded font-label-mono"></div>
            <div id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

            <section class="bg-white rounded-xl p-6 shadow-xl text-gray-800">
                <header class="flex justify-between items-center mb-6 border-b border-gray-200 pb-4">
                    <h2 class="font-headline-lg-mobile text-black flex items-center gap-2">
                        <span class="material-symbols-outlined text-blue-600">schema</span> Saída de Dados
                    </h2>
                    <div class="flex space-x-1 bg-gray-100 p-1 rounded-lg">
                        <button class="tab-button active bg-white text-black shadow-sm px-4 py-2 font-label-mono text-sm rounded-md transition-all" onclick="mudarAba('mapa', event)">Mapa Visual</button>
                        <button class="tab-button text-gray-600 hover:text-black px-4 py-2 font-label-mono text-sm transition-all rounded-md" onclick="mudarAba('lista', event)">Lista</button>
                    </div>
                </header>
                
                <div id="mapa" class="tab-content active flex flex-wrap justify-center gap-6 bg-gray-50 p-4 rounded-lg border border-gray-200"></div>
                <div id="lista" class="tab-content hidden max-h-[500px] overflow-y-auto pr-2 bg-gray-50 p-4 rounded-lg border border-gray-200"><div id="listContainer"></div></div>

                <!-- Botão de CSV removido para manter a funcionalidade premium futura -->
                <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3 border-t border-gray-200 pt-4">
                    <button class="py-2 rounded font-label-mono flex items-center justify-center gap-1 border border-gray-300 hover:bg-gray-100 text-black transition-colors" onclick="imprimirResultado()">
                        <span class="material-symbols-outlined">print</span> IMPRIMIR
                    </button>
                    <button class="py-2 rounded font-label-mono flex items-center justify-center gap-1 border border-gray-300 hover:bg-gray-100 text-black transition-colors" onclick="exportarJSON()">
                        <span class="material-symbols-outlined">data_object</span> JSON
                    </button>
                    <button class="py-2 rounded font-label-mono flex items-center justify-center gap-1 bg-gray-900 text-white hover:bg-gray-800 transition-colors" onclick="voltarFormulario()">
                        <span class="material-symbols-outlined">arrow_back</span> NOVO
                    </button>
                </div>
            </section>
        </div>
    </div>
</main>

<!-- MODAL GENÉRICO PARA SELEÇÃO E FORMAÇÃO DE GRUPOS -->
<div id="modalOverlay" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center px-4">
    <div class="bg-surface-container rounded-xl border border-outline-variant w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl modal-enter">
        <div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-highest rounded-t-xl">
            <h3 id="modalTitle" class="font-headline-lg-mobile text-primary flex items-center gap-2">Título</h3>
            <button onclick="fecharModal()" class="text-on-surface-variant hover:text-error"><span class="material-symbols-outlined">close</span></button>
        </div>
        
        <div id="modalGruposArea" class="hidden p-4 border-b border-outline-variant bg-surface-dim flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-xs font-label-mono text-on-surface-variant">Grupos Formados:</span>
                <button onclick="criarGrupoModal()" class="text-xs font-label-mono bg-primary-container text-on-primary-container px-2 py-1 rounded hover:opacity-80">+ FORMAR GRUPO</button>
            </div>
            <div id="listaGruposModal" class="flex flex-col gap-2 mt-2"></div>
        </div>

        <div class="p-4 flex-1 overflow-y-auto">
            <input type="text" id="modalBusca" placeholder="Buscar aluno..." class="w-full bg-surface-dim border border-outline-variant text-primary rounded p-2 text-sm font-label-mono mb-4 focus:outline-none focus:border-secondary-container">
            <div id="modalListaAlunos" class="flex flex-col gap-1"></div>
        </div>
        
        <div id="modalFooter" class="p-4 border-t border-outline-variant bg-surface-container-highest rounded-b-xl flex justify-end gap-3">
            <button onclick="fecharModal()" class="px-4 py-2 text-sm font-label-mono text-on-surface-variant hover:text-primary">CANCELAR</button>
            <button onclick="salvarModal()" class="px-4 py-2 text-sm font-label-mono bg-primary text-on-primary rounded font-bold hover:opacity-90">SALVAR SELEÇÃO</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
