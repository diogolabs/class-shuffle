<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embaralhador de Turmas para Provas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Embaralhador de Turmas para Provas</h1>
            <p>Organize alunos de forma inteligente respeitando regras e mapeamento</p>
        </div>
        <div class="main-content">
            <div class="form-section" id="formSection">
                <div class="error-message" id="errorMessage"></div>
                
                <div class="form-group">
                    <label for="disciplina">📖 Disciplina/Matéria</label>
                    <input type="text" id="disciplina" placeholder="Ex: Robótica, Matemática...">
                </div>

                <div class="form-group">
                    <label for="alunos">👥 Lista de Alunos</label>
                    <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                        <button type="button" class="btn-secondary" style="font-size: 12px; padding: 8px;" onclick="document.getElementById('csvInput').click()">
                            📁 IMPORTAR CSV
                        </button>
                        <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="processarCSV(event)">
                    </div>
                    <p style="font-size: 11px; color: #666; margin-bottom: 5px;">
                        * Formato manual: Nome - Turma<br>
                        * Formato CSV: Duas colunas (Nome e Turma). Não inclua cabeçalhos.
                    </p>
                    <textarea id="alunos" placeholder="Exemplo:&#10;João Silva - 9A&#10;Maria Santos - 9B"></textarea>
                </div>

                <div class="form-group">
                    <label>🏫 Configuração das Salas</label>
                    <div class="row-inputs">
                        <div class="form-group"><label for="numSalas">Salas</label><input type="number" id="numSalas" value="2" min="1"></div>
                        <div class="form-group"><label for="numFileiras">Fileiras</label><input type="number" id="numFileiras" value="5" min="1"></div>
                        <div class="form-group"><label for="numCarteiras">Carteiras</label><input type="number" id="numCarteiras" value="6" min="1"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="agrupamento">👫 Tipo de Agrupamento</label>
                    <select id="agrupamento">
                        <option value="solo">Solo (Cada aluno sozinho)</option>
                        <option value="dupla">Dupla (2 alunos por carteira)</option>
                        <option value="grupo">Grupo (3+ alunos por carteira)</option>
                    </select>
                </div>

                <div class="form-group" id="tamanhoGrupoGroup" style="display: none;">
                    <label for="tamanhoGrupo">Tamanho do Grupo</label>
                    <input type="number" id="tamanhoGrupo" value="3" min="2">
                </div>
                
                <div class="form-group">
                    <label for="regraTurma">🏷️ Regra de Turmas</label>
                    <select id="regraTurma">
                        <option value="nenhuma">Ignorar turmas</option>
                        <option value="separar">Misturar turmas (Evitar alunos da mesma turma próximos)</option>
                        <option value="agrupar">Agrupar por turma (Manter alunos da mesma turma juntos)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>⚙️ Regras Adicionais</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item"><input type="checkbox" id="proximoProfessor"><label for="proximoProfessor">Alunos especiais perto do professor</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="mesmaFileira"><label for="mesmaFileira">Permitir agrupamentos aleatórios</label></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="alunosEspeciais">📍 Alunos Especiais (Frente da Sala)</label>
                    <textarea id="alunosEspeciais" placeholder="Um nome por linha"></textarea>
                </div>

                <div class="button-group">
                    <button class="btn-primary" onclick="embaralhar()">🔀 EMBARALHAR TURMAS</button>
                    <button class="btn-secondary" onclick="limparFormulario()">🗑️ LIMPAR</button>
                </div>
            </div>

            <div class="result-section" id="resultSection">
                <div class="success-message" id="successMessage"></div>
                <div class="stats" id="stats"></div>
                <div class="tabs">
                    <button class="tab-button active" onclick="mudarAba('mapa', event)">🗺️ Mapa Visual</button>
                    <button class="tab-button" onclick="mudarAba('lista', event)">📋 Lista Detalhada</button>
                </div>
                <div id="mapa" class="tab-content active">
                    <div class="map-container"><canvas id="mapCanvas"></canvas></div>
                </div>
                <div id="lista" class="tab-content">
                    <div class="list-container" id="listContainer"></div>
                </div>
                <div class="button-group">
                    <button class="btn-export" onclick="imprimirResultado()">🖨️ IMPRIMIR</button>
                    <button class="btn-export" onclick="exportarJSON()">💾 BAIXAR JSON</button>
                    <button class="btn-secondary" onclick="voltarFormulario()">← VOLTAR</button>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
